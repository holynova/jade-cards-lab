<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静意 · ui-ux-kit</title>
<style>
:root{--bg:#101010;--ink:#ece7da;--mut:#8f8a7c;--line:#262626;--acc:#e8dcc0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Georgia,serif;min-height:100vh}
.wrap{max-width:1020px;margin:0 auto;padding:56px 28px 100px}
header{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:8px}
h1{font-family:Georgia,"Songti SC",serif;font-size:26px;font-weight:500;letter-spacing:6px}
.count{font-size:12px;color:var(--mut);letter-spacing:2px}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.sec-h h2{font-size:17px;font-weight:500;letter-spacing:8px}
.sec-h span{font-size:11px;color:var(--mut);letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cell{background:var(--bg);padding:26px;cursor:pointer;transition:background .2s ease-out}
.cell:hover{background:#161616}
.cell img{width:100%;aspect-ratio:3/4.4;object-fit:cover;display:block;transition:transform .35s ease-out}
.cell:hover img{transform:scale(1.03)}
.cell .n{margin-top:16px;font-size:15px;letter-spacing:2px}
.cell .r{margin-top:6px;font-size:11px;color:var(--mut);letter-spacing:3px;text-transform:uppercase}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.94);display:none;align-items:center;justify-content:center;padding:30px}
.lb.open{display:flex}
.lb-in{display:flex;gap:44px;max-width:860px;width:100%;align-items:center;animation:lbIn .3s ease-out}
@keyframes lbIn{from{opacity:0;transform:translateY(14px)}}
.lb img{width:min(38vh,300px);aspect-ratio:3/4.4;object-fit:cover;display:block}
.lb .meta .idx{font-size:11px;letter-spacing:3px;color:var(--mut)}
.lb .meta h3{font-family:Georgia,"Songti SC",serif;font-size:34px;font-weight:500;letter-spacing:6px;margin:12px 0}
.lb .meta .rk{font-size:13px;letter-spacing:3px;color:var(--acc)}
.lb .meta .th{margin-top:18px;font-size:13px;color:var(--mut);letter-spacing:2px;line-height:2}
.lb .nav{margin-top:28px;display:flex;gap:12px}
.btn{background:transparent;border:1px solid #3a3a3a;color:var(--ink);padding:10px 22px;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:border-color .2s}
.btn:hover{border-color:var(--acc)}
.x{position:absolute;top:22px;right:28px;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.lb-in{flex-direction:column;gap:20px}.lb img{width:200px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>玉石浮雕卡牌馆</h1><span class="count">75 张 · ui-ux-kit</span></header>
<div id="secs"></div>
</div>
<div class="lb" id="lb">
<button class="x" id="x">×</button>
<div class="lb-in">
<img id="lbImg" src="">
<div class="meta">
<div class="idx" id="lbIdx"></div>
<h3 id="lbName"></h3>
<div class="rk" id="lbRank"></div>
<div class="th" id="lbTheme"></div>
<div class="nav"><button class="btn" id="prev">← 上一张</button><button class="btn" id="next">下一张 →</button></div>
</div>
</div>
</div>
<script src="data.js"></script>
<script>
var secs=document.getElementById('secs'),lb=document.getElementById('lb'),idx=0;
var themes=[];
CARDS.forEach(function(c){
  var t=themes.find(function(x){return x.name===c.theme;});
  if(!t){t={cat:c.cat,name:c.theme,cards:[]};themes.push(t);}
  t.cards.push(c);
});
secs.innerHTML=themes.map(function(t){
  return '<section class="sec"><div class="sec-h"><h2>'+t.name+'</h2><span>'+t.cat+' · '+t.cards.length+' 张</span></div>'
  +'<div class="grid">'+t.cards.map(function(c){
    var g=CARDS.indexOf(c);
    return '<div class="cell" data-i="'+g+'"><img loading="lazy" src="'+IMG+c.f+'.webp"><div class="n">'+c.name+'</div><div class="r">'+c.rank+'</div></div>';
  }).join('')+'</div></section>';
}).join('');
function show(i){
  idx=(i+CARDS.length)%CARDS.length;
  var c=CARDS[idx];
  document.getElementById('lbImg').src=IMG+c.f+'.webp';
  document.getElementById('lbIdx').textContent=(idx+1)+' / '+CARDS.length;
  document.getElementById('lbName').textContent=c.name;
  document.getElementById('lbRank').textContent=c.rank;
  document.getElementById('lbTheme').textContent=c.cat+' · '+c.theme;
}
secs.addEventListener('click',function(e){
  var cell=e.target.closest('.cell');if(!cell)return;
  show(+cell.getAttribute('data-i'));lb.classList.add('open');
});
document.getElementById('x').onclick=function(){lb.classList.remove('open');};
document.getElementById('prev').onclick=function(){show(idx-1);};
document.getElementById('next').onclick=function(){show(idx+1);};
lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open');});
document.addEventListener('keydown',function(e){
  if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowRight')show(idx+1);
  if(e.key==='ArrowLeft')show(idx-1);
});
</script>
</body>
</html>
