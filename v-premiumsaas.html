<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>聚光 · Premium SaaS</title>
<style>
:root{--bg:#07080d;--gold:#e8c95a;--ink:#f2ede1;--mut:#8b8fa0}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow-x:hidden}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(560px circle at var(--sx,50%) var(--sy,38%),rgba(232,201,90,.14),rgba(120,90,200,.06) 45%,transparent 70%);transition:background .12s linear}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;pointer-events:none}
.o1{width:480px;height:480px;left:-120px;top:-120px;background:radial-gradient(circle,#3b2f6b,transparent 70%)}
.o2{width:520px;height:520px;right:-140px;bottom:-100px;background:radial-gradient(circle,#6b4a1f,transparent 70%)}
.hero-in{position:relative;z-index:2;text-align:center;padding:40px 24px;max-width:900px}
.eyebrow{font-size:11px;letter-spacing:6px;color:var(--gold);text-transform:uppercase}
h1{font-size:clamp(44px,9vw,96px);font-weight:600;letter-spacing:12px;margin:22px 0 10px;text-indent:12px}
h1 .g{background:linear-gradient(120deg,#f7e7b0,#e8c95a 40%,#9a7420);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--mut);font-size:15px;letter-spacing:2px;line-height:2;max-width:560px;margin:0 auto}
.feat{margin:38px auto 0;width:min(300px,62vw);perspective:1000px;cursor:pointer}
.feat .in{position:relative;aspect-ratio:3/4.4;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1)}
.feat.flip .in{transform:rotateY(180deg)}
.ff{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid rgba(232,201,90,.28);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(232,201,90,.08)}
.ff img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ff.fr{transform:rotateY(180deg)}
.ff::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,transparent 32%)}
.fcap{margin-top:18px}
.fcap .n{font-size:20px;letter-spacing:6px}
.fcap .r{margin-top:8px;font-size:12px;letter-spacing:3px;color:var(--gold)}
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.pill{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:var(--ink);border-radius:999px;padding:10px 22px;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all .2s ease-out;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.pill:hover{border-color:rgba(232,201,90,.5)}
.pill.on{background:linear-gradient(180deg,#f2d97e,#d9a93f);color:#241a06;border-color:transparent;font-weight:600}
.cue{margin-top:34px;color:var(--mut);font-size:12px;letter-spacing:4px;animation:cue 2s ease-in-out infinite}
@keyframes cue{0%,100%{opacity:.5;transform:translateY(0)}50%{opacity:1;transform:translateY(6px)}}
.all{padding:90px 26px;max-width:1180px;margin:0 auto}
.all h2{font-size:24px;letter-spacing:10px;text-align:center;margin-bottom:8px}
.all .sub2{text-align:center;color:var(--mut);font-size:12px;letter-spacing:3px;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.gcard{border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);cursor:pointer;transition:transform .25s ease-out,border-color .25s}
.gcard:hover{transform:translateY(-6px);border-color:rgba(232,201,90,.4)}
.gcard img{width:100%;aspect-ratio:3/4.4;object-fit:cover;display:block;pointer-events:none}
.gcard .n{padding:10px 12px 4px;font-size:13px;letter-spacing:2px}
.gcard .r{padding:0 12px 12px;font-size:11px;color:var(--mut);letter-spacing:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="hero" id="hero">
<div class="orb o1"></div><div class="orb o2"></div><div class="spot" id="spot"></div>
<div class="hero-in">
<div class="eyebrow">Premium SaaS · Noir Spotlight</div>
<h1><span class="g">七十五</span>张玉牌</h1>
<p class="lede">以光雕刻表面。把聚光灯打在玉上，<br>剩下的交给阴影。</p>
<div class="feat" id="feat"><div class="in">
<div class="ff"><img id="featImg" src=""></div>
<div class="ff fr"><img src="https://holynova.github.io/jade-relief-cards/img/card-back-v3.webp"></div>
</div><div class="fcap"><div class="n" id="featName"></div><div class="r" id="featRank"></div></div></div>
<div class="pills" id="pills"></div>
<div class="cue">↓ 浏览全集</div>
</div>
</section>
<section class="all">
<h2>全集</h2><div class="sub2">75 张 · 点击任意卡牌查看大图</div>
<div class="grid" id="grid"></div>
</section>
<script src="data.js"></script>
<script>
var hero=document.getElementById('hero'),spot=document.getElementById('spot');
hero.addEventListener('pointermove',function(e){
  var r=hero.getBoundingClientRect();
  spot.style.setProperty('--sx',((e.clientX-r.left)/r.width*100)+'%');
  spot.style.setProperty('--sy',((e.clientY-r.top)/r.height*100)+'%');
});
var featThemes=['西游记','三国演义','龙珠','黑神话：悟空','宝可梦'];
var pills=document.getElementById('pills');
function setFeat(theme){
  var c=CARDS.find(function(x){return x.theme===theme;});
  document.getElementById('featImg').src=IMG+c.f+'.webp';
  document.getElementById('featName').textContent=c.name;
  document.getElementById('featRank').textContent=c.rank+' · '+c.theme;
  pills.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('on',p.textContent===theme);});
}
pills.innerHTML=featThemes.map(function(t){return '<button class="pill">'+t+'</button>';}).join('');
pills.addEventListener('click',function(e){
  var p=e.target.closest('.pill');if(p)setFeat(p.textContent);
});
document.getElementById('feat').addEventListener('click',function(){this.classList.toggle('flip');});
setFeat('西游记');
document.getElementById('grid').innerHTML=CARDS.map(function(c){
  return '<div class="gcard"><img loading="lazy" src="'+IMG+c.f+'.webp"><div class="n">'+c.name+'</div><div class="r">'+c.rank+' · '+c.theme+'</div></div>';
}).join('');
</script>
</body>
</html>
