<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>触感 · Emil Kowalski</title>
<style>
:root{--bg:#0d0b08;--gold:#d4af37;--ink:#e8dcc0;--mut:#9a8a68}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(13,11,8,.86);backdrop-filter:blur(12px);padding:16px 26px;border-bottom:1px solid rgba(212,175,55,.16);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:18px;letter-spacing:8px;color:var(--gold);font-weight:600}
.sub{font-size:12px;color:var(--mut);letter-spacing:2px}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{background:transparent;border:1px solid #4a3d24;color:var(--mut);border-radius:999px;padding:8px 18px;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:inherit;transition:all .22s ease-out}
.chip:hover{color:var(--ink);border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#171208}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:24px;padding:32px 26px 90px;max-width:1180px;margin:0 auto}
.card{perspective:1000px;cursor:pointer;animation:deal .7s cubic-bezier(.2,.8,.3,1.06) backwards}
@keyframes deal{from{opacity:0;transform:translateY(48px) scale(.92)}to{opacity:1;transform:none}}
.in{position:relative;aspect-ratio:3/4.4;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out}
.card.flip .in{transform:rotateX(var(--rx,0deg)) rotateY(calc(180deg + var(--ry,0deg)));transition:transform .55s cubic-bezier(.3,1.35,.4,1)}
.card:hover .in{filter:brightness(1.06)}
.face{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 16px 38px rgba(0,0,0,.55),0 0 0 1px rgba(212,175,55,.22);transition:box-shadow .25s ease-out}
.card:hover .face{box-shadow:0 24px 54px rgba(0,0,0,.6),0 0 0 1px rgba(212,175,55,.45)}
.face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.face.fr{transform:rotateY(180deg)}
.face.fr::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(255,242,205,.30),transparent 60%);opacity:var(--sh,0);transition:opacity .25s}
.cap{text-align:center;margin-top:12px}
.cap .n{font-size:14px;letter-spacing:2px}
.cap .r{font-size:12px;color:var(--mut);letter-spacing:2px;margin-top:4px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px;letter-spacing:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
<h1>触感</h1><span class="sub">Emil Kowalski · 75 张玉石浮雕卡</span>
<div class="chips" id="chips"></div>
</header>
<div class="grid" id="grid"></div>
<script src="data.js"></script>
<script>
var grid=document.getElementById('grid'),chips=document.getElementById('chips');
var cats=['全部','名著','漫画','游戏'],cur='全部';
var fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
function suit(r){return r.replace('黑桃','♠').replace('红桃','♥').replace('梅花','♣').replace('方块','♦');}
function render(){
  var list=CARDS.filter(function(c){return cur==='全部'||c.cat===cur;});
  grid.innerHTML=list.length?list.map(function(c,i){
    return '<div class="card" style="animation-delay:'+Math.min(i*22,900)+'ms">'
    +'<div class="in"><div class="face"><img loading="lazy" src="'+BACK+'"></div>'
    +'<div class="face fr"><img loading="lazy" src="'+IMG+c.f+'.webp"></div></div>'
    +'<div class="cap"><div class="n">'+c.name+'</div><div class="r">'+suit(c.rank)+' · '+c.theme+'</div></div></div>';
  }).join(''):'<div class="empty">没有卡片</div>';
  bind();
}
function bind(){
  var cards=grid.querySelectorAll('.card');
  cards.forEach(function(cd){
    var inn=cd.querySelector('.in'),fr=cd.querySelector('.fr');
    cd.addEventListener('click',function(){cd.classList.toggle('flip');});
    if(!fine)return;
    cd.addEventListener('pointermove',function(e){
      var r=inn.getBoundingClientRect();
      var x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      inn.style.setProperty('--ry',(x*16)+'deg');
      inn.style.setProperty('--rx',(-y*16)+'deg');
      fr.style.setProperty('--mx',((x+.5)*100)+'%');
      fr.style.setProperty('--my',((y+.5)*100)+'%');
      fr.style.setProperty('--sh',1);
    });
    cd.addEventListener('pointerleave',function(){
      inn.style.setProperty('--rx','0deg');inn.style.setProperty('--ry','0deg');
      fr.style.setProperty('--sh',0);
    });
  });
}
chips.innerHTML=cats.map(function(c){return '<button class="chip'+(c===cur?' on':'')+'" data-c="'+c+'">'+c+'</button>';}).join('');
chips.addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  cur=b.getAttribute('data-c');
  chips.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===b);});
  render();
});
render();
</script>
</body>
</html>
