<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>玉石浮雕 · 108 珍藏</title>
<meta name="description" content="108 张精雕玉石浮雕扑克牌艺术展陈，极简纯净呈现，支持 PC 端 3D 卡牌光影交互与全屏高清品鉴。">
<script defer src="https://cloud.umami.is/script.js" data-website-id="e01c9f78-4607-4e60-b01c-77c8190b12b4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg-deep: #080706;
  --bg-surface: #12100e;
  --gold: #d9a441;
  --gold-glow: rgba(217, 164, 65, 0.25);
  --paper: #f4efe2;
  --paper-mut: #8e8675;
  --card-aspect: 2 / 3;
  --ease-smooth: cubic-bezier(0.25, 1, 0.5, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: var(--bg-deep);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(217, 164, 65, 0.06) 0%, transparent 60%),
    radial-gradient(circle at 80% 40%, rgba(94, 168, 155, 0.03) 0%, transparent 50%);
  color: var(--paper);
  font-family: "Noto Serif SC", "Songti SC", STSong, "PingFang SC", serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* Custom Minimal Scrollbar */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: #080706;
}
::-webkit-scrollbar-thumb {
  background: rgba(217, 164, 65, 0.25);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--gold);
}

/* Top Minimal Navigation Bar */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(8, 7, 6, 0.85);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(217, 164, 65, 0.15);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: inherit;
}

.seal {
  width: 24px;
  height: 24px;
  border: 1.5px solid #c94030;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ff8575;
  font-size: 11px;
  font-weight: 900;
  background: rgba(201, 64, 48, 0.15);
}

.title {
  font-size: 17px;
  letter-spacing: 4px;
  font-weight: 700;
  color: var(--gold);
}

.sub {
  font-family: "Cinzel", serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--paper-mut);
  margin-left: 6px;
  opacity: 0.8;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.count-pill {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--paper-mut);
  padding: 4px 10px;
  border-radius: 12px;
  background: rgba(217, 164, 65, 0.08);
  border: 1px solid rgba(217, 164, 65, 0.18);
}

.github-link {
  color: var(--paper-mut);
  display: flex;
  align-items: center;
  text-decoration: none;
  transition: color 0.2s;
}
.github-link:hover {
  color: var(--gold);
}
.github-link svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

/* Minimalist Gallery Grid */
.gallery-wrap {
  width: 100%;
  max-width: 1480px;
  margin: 0 auto;
  padding: 28px 24px 80px;
  flex: 1;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 24px 20px;
  align-items: start;
}

/* 3D Card Item */
.card-item {
  position: relative;
  aspect-ratio: 2 / 3;
  perspective: 1000px;
  cursor: pointer;
  content-visibility: auto;
  border-radius: 10px;
}

.card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 10px;
  overflow: hidden;
  background: var(--bg-surface);
  transform-style: preserve-3d;
  transition: transform 0.2s var(--ease-smooth), box-shadow 0.2s var(--ease-smooth);
  box-shadow: 
    0 8px 20px rgba(0, 0, 0, 0.7),
    0 0 0 1px rgba(217, 164, 65, 0.22);
}

/* Gilded Frame */
.card-inner::after {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid rgba(217, 164, 65, 0.35);
  border-radius: 7px;
  pointer-events: none;
  z-index: 4;
}

/* Image */
.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  pointer-events: none;
  transition: transform 0.4s var(--ease-smooth);
  background: #000;
}

/* Specular Glint Sheen (Desktop Hover) */
.card-glint {
  position: absolute;
  inset: 0;
  border-radius: 10px;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.3s;
  mix-blend-mode: overlay;
}

/* Desktop Hover States */
@media (hover: hover) and (pointer: fine) {
  .card-item:hover .card-inner {
    box-shadow: 
      0 20px 40px rgba(0, 0, 0, 0.85),
      0 0 24px var(--gold-glow),
      0 0 0 1px rgba(217, 164, 65, 0.5);
  }
  .card-item:hover .card-glint {
    opacity: 1;
  }
  .card-item:hover .card-img {
    transform: scale(1.02);
  }
}

/* Full-Screen Minimalist Lightbox */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(5, 4, 3, 0.94);
  -webkit-backdrop-filter: blur(24px);
  backdrop-filter: blur(24px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.28s var(--ease-smooth);
}
.lightbox.active {
  opacity: 1;
  pointer-events: auto;
}

.lightbox-close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid rgba(217, 164, 65, 0.25);
  background: rgba(18, 16, 14, 0.8);
  color: var(--paper-mut);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 110;
  transition: all 0.2s;
}
.lightbox-close:hover {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(217, 164, 65, 0.15);
}
.lightbox-close svg {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.lightbox-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  max-width: 90vw;
  max-height: 90vh;
}

.lightbox-img-wrap {
  position: relative;
  width: min(85vw, calc(82vh * var(--card-ratio, 0.6667)));
  aspect-ratio: var(--card-aspect, 2 / 3);
  max-height: 82vh;
  max-width: 85vw;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 
    0 24px 60px rgba(0, 0, 0, 0.95),
    0 0 0 1px rgba(217, 164, 65, 0.35);
  background: #080706;
}

.lightbox-img-wrap::after {
  content: "";
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(217, 164, 65, 0.4);
  border-radius: 8px;
  pointer-events: none;
  z-index: 5;
}

.lightbox-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.lightbox-thumb {
  z-index: 2;
  opacity: 1;
}

.lightbox-full {
  z-index: 3;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.lightbox-full.loaded {
  opacity: 1;
}

.lightbox-caption {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--paper-mut);
  text-align: center;
}
.lightbox-caption .name {
  color: var(--gold);
  font-weight: 600;
  margin-right: 8px;
}

/* Nav arrows */
.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 1px solid rgba(217, 164, 65, 0.2);
  background: rgba(18, 16, 14, 0.7);
  color: var(--paper-mut);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 110;
}
.lightbox-nav:hover {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(217, 164, 65, 0.15);
}
.lightbox-nav.prev {
  left: 24px;
}
.lightbox-nav.next {
  right: 24px;
}
.lightbox-nav svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

/* Responsive Rules */
@media (max-width: 768px) {
  .top-bar {
    padding: 12px 18px;
  }
  .title {
    font-size: 15px;
    letter-spacing: 3px;
  }
  .sub {
    display: none;
  }
  .gallery-wrap {
    padding: 18px 14px 60px;
  }
  .gallery-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px 12px;
  }
  .lightbox-nav {
    display: none;
  }
  .lightbox-img-wrap {
    width: min(92vw, calc(80vh * var(--card-ratio, 0.6667)));
    max-width: 92vw;
    max-height: 80vh;
  }
}

@media (min-width: 1400px) {
  .gallery-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>
<body>

<!-- Minimalist Header -->
<header class="top-bar">
  <a href="https://xiaosang.cc/jade-cards-lab/" class="brand">
    <div class="seal">御</div>
    <div class="title">玉石浮雕<span class="sub">KINPAKU · 108</span></div>
  </a>

  <div class="top-right">
    <span class="count-pill">108 张精雕</span>
    <a href="https://github.com/holynova/jade-cards-lab" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub 源码">
      <svg viewBox="0 0 24 24"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
    </a>
  </div>
</header>

<!-- Minimalist Gallery Stage -->
<main class="gallery-wrap">
  <div class="gallery-grid" id="grid">
    <!-- Populated by JS -->
  </div>
</main>

<!-- Fullscreen Lightbox Modal -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="卡牌大图品鉴">
  <button class="lightbox-close" id="lightboxClose" title="关闭 (Esc)">
    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>
  <button class="lightbox-nav prev" id="lightboxPrev" title="上一张 (←)">
    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
  </button>
  <button class="lightbox-nav next" id="lightboxNext" title="下一张 (→)">
    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </button>

  <div class="lightbox-stage">
    <div class="lightbox-img-wrap">
      <img id="lightboxThumb" class="lightbox-img lightbox-thumb" src="" alt="预览">
      <img id="lightboxFull" class="lightbox-img lightbox-full" src="" alt="大图品鉴">
    </div>
    <div class="lightbox-caption" id="lightboxCaption">
      <span class="name" id="capName"></span>
      <span class="meta" id="capMeta"></span>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function() {
  'use strict';

  var THUMB_PREFIX = 'assets/thumbs/';
  var FULL_PREFIX = (typeof IMG !== 'undefined' ? IMG : 'https://holynova.github.io/jade-relief-cards/img/');
  var grid = document.getElementById('grid');
  var lightbox = document.getElementById('lightbox');
  var lightboxImgWrap = document.querySelector('.lightbox-img-wrap');
  var lightboxThumb = document.getElementById('lightboxThumb');
  var lightboxFull = document.getElementById('lightboxFull');
  var lightboxClose = document.getElementById('lightboxClose');
  var lightboxPrev = document.getElementById('lightboxPrev');
  var lightboxNext = document.getElementById('lightboxNext');
  var capName = document.getElementById('capName');
  var capMeta = document.getElementById('capMeta');

  var currentIndex = 0;
  var requestToken = 0;

  // 1. Build Minimalist Grid: Pure Images, All Front Face
  // All 108 cards are strictly unified to standard 2:3 aspect ratio (360x540 thumbs, 1280x1920 full)
  // Optimized loading: First 6 cards eager + fetchpriority="high", rest lazy
  var html = '';
  for (var i = 0; i < CARDS.length; i++) {
    var c = CARDS[i];
    var thumbSrc = THUMB_PREFIX + c.f + '.webp';
    var isPriority = i < 6;
    var loadingAttr = isPriority ? 'loading="eager" fetchpriority="high"' : 'loading="lazy" decoding="async"';

    html += '<div class="card-item" data-idx="' + i + '" tabindex="0" role="button" aria-label="' + c.name + ' - ' + c.theme + '">'
      + '<div class="card-inner">'
      + '<img class="card-img" src="' + thumbSrc + '" alt="' + c.name + '" ' + loadingAttr + ' width="360" height="540">'
      + '<div class="card-glint"></div>'
      + '</div>'
      + '</div>';
  }
  grid.innerHTML = html;

  // 2. PC Interactive 3D Card Parallax / Tilt Effect
  var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

  if (!isTouch) {
    grid.addEventListener('mousemove', function(e) {
      var item = e.target.closest('.card-item');
      if (!item) return;

      var inner = item.querySelector('.card-inner');
      var glint = item.querySelector('.card-glint');
      var rect = item.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width - 0.5;
      var y = (e.clientY - rect.top) / rect.height - 0.5;

      var rotY = (x * 22).toFixed(2);
      var rotX = (-y * 22).toFixed(2);
      inner.style.transform = 'rotateY(' + rotY + 'deg) rotateX(' + rotX + 'deg) translateY(-8px) scale(1.03)';

      if (glint) {
        var glintX = ((x + 0.5) * 100).toFixed(1);
        var glintY = ((y + 0.5) * 100).toFixed(1);
        glint.style.background = 'radial-gradient(circle at ' + glintX + '% ' + glintY + '%, rgba(255, 240, 200, 0.45) 0%, transparent 65%)';
      }
    });

    grid.addEventListener('mouseout', function(e) {
      var item = e.target.closest('.card-item');
      if (!item) return;
      var related = e.relatedTarget;
      if (item.contains(related)) return;

      var inner = item.querySelector('.card-inner');
      var glint = item.querySelector('.card-glint');
      if (inner) {
        inner.style.transform = 'rotateY(0deg) rotateX(0deg) translateY(0) scale(1)';
      }
      if (glint) {
        glint.style.background = 'none';
      }
    });
  }

  // 3. Progressive Image Loading & Decoding Lightbox
  // Displays thumbnail immediately at full container size (zero jumping / zero sudden zoom),
  // then seamlessly fades in decoded high-res image over it.
  async function showLightbox(index) {
    currentIndex = index;
    var card = CARDS[index];
    if (!card) return;

    var currentToken = ++requestToken;
    var thumbUrl = THUMB_PREFIX + card.f + '.webp';
    var fullUrl = FULL_PREFIX + card.f + '.webp';

    // 1. Show thumbnail immediately at full container size
    lightboxThumb.src = thumbUrl;
    lightboxThumb.alt = card.name;
    lightboxFull.classList.remove('loaded');
    lightboxFull.src = '';

    capName.textContent = card.name;
    capMeta.textContent = card.theme + ' · ' + card.rank + ' · ' + (index + 1) + ' / ' + CARDS.length;

    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 2. Decode full-resolution image offscreen
    try {
      var offscreen = new Image();
      offscreen.src = fullUrl;
      if (offscreen.decode) {
        await offscreen.decode();
      } else {
        await new Promise(function(resolve, reject) {
          offscreen.onload = resolve;
          offscreen.onerror = reject;
        });
      }
      // If user hasn't switched or closed in the meantime, smoothly crossfade to high-res
      if (currentToken === requestToken) {
        lightboxFull.src = fullUrl;
        lightboxFull.alt = card.name;
        requestAnimationFrame(function() {
          lightboxFull.classList.add('loaded');
        });
      }
    } catch (err) {
      console.warn('High-res image decode failed, retaining thumbnail', err);
    }
  }

  function closeLightbox() {
    requestToken++;
    lightbox.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(function() {
      if (!lightbox.classList.contains('active')) {
        lightboxFull.classList.remove('loaded');
        lightboxFull.src = '';
        lightboxThumb.src = '';
      }
    }, 300);
  }

  function prevCard() {
    var nextIdx = (currentIndex - 1 + CARDS.length) % CARDS.length;
    showLightbox(nextIdx);
  }

  function nextCard() {
    var nextIdx = (currentIndex + 1) % CARDS.length;
    showLightbox(nextIdx);
  }

  // Event Listeners
  grid.addEventListener('click', function(e) {
    var item = e.target.closest('.card-item');
    if (!item) return;
    var idx = parseInt(item.dataset.idx, 10);
    showLightbox(idx);
  });

  grid.addEventListener('keydown', function(e) {
    var item = e.target.closest('.card-item');
    if (!item) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      var idx = parseInt(item.dataset.idx, 10);
      showLightbox(idx);
    }
  });

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', function(e) {
    e.stopPropagation();
    prevCard();
  });
  lightboxNext.addEventListener('click', function(e) {
    e.stopPropagation();
    nextCard();
  });

  lightbox.addEventListener('click', function(e) {
    if (e.target === lightbox || e.target.classList.contains('lightbox-stage')) {
      closeLightbox();
    }
  });

  window.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') {
      closeLightbox();
    } else if (e.key === 'ArrowLeft') {
      prevCard();
    } else if (e.key === 'ArrowRight') {
      nextCard();
    }
  });

  // Touch Swipe on Lightbox
  var touchStartX = 0;
  lightbox.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  lightbox.addEventListener('touchend', function(e) {
    var diffX = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diffX) > 50) {
      if (diffX > 0) prevCard();
      else nextCard();
    }
  }, { passive: true });

  // Deep linking: support ?card=index or ?card=name/id
  var params = new URLSearchParams(window.location.search);
  var cardQuery = params.get('card');
  if (cardQuery !== null) {
    var queryIdx = parseInt(cardQuery, 10);
    if (isNaN(queryIdx)) {
      for (var k = 0; k < CARDS.length; k++) {
        if (CARDS[k].f === cardQuery || CARDS[k].name === cardQuery) {
          queryIdx = k;
          break;
        }
      }
    }
    if (!isNaN(queryIdx) && queryIdx >= 0 && queryIdx < CARDS.length) {
      showLightbox(queryIdx);
    }
  }

})();
</script>
</body>
</html>
