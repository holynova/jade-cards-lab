<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>流光 · Liquid Glass</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a10;color:#f0eef6;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Georgia,serif;min-height:100vh;overflow-x:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;animation:drift 14s ease-in-out infinite alternate}
.o1{width:520px;height:520px;left:-140px;top:-100px;background:radial-gradient(circle,rgba(64,180,140,.5),transparent 70%)}
.o2{width:460px;height:460px;right:-120px;top:30%;background:radial-gradient(circle,rgba(212,175,55,.42),transparent 70%);animation-delay:-5s}
.o3{width:600px;height:600px;left:20%;bottom:-220px;background:radial-gradient(circle,rgba(120,110,220,.4),transparent 70%);animation-delay:-9s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,40px) scale(1.12)}}
nav{position:sticky;top:14px;z-index:20;max-width:1180px;margin:0 14px}
.navglass{margin:0 auto;max-width:860px;background:rgba(20,20,30,.42);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.16);border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-family:Georgia,"Songti SC",serif;font-size:16px;letter-spacing:5px}
.seg{margin-left:auto;display:flex;background:rgba(255,255,255,.08);border-radius:14px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;color:rgba(240,238,246,.65);font-size:13px;padding:9px 18px;border-radius:11px;cursor:pointer;font-family:inherit;transition:all .22s ease-out}
.seg button.on{background:rgba(255,255,255,.85);color:#14141c;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.25)}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:34px 22px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
.gcard{cursor:pointer;perspective:1000px;animation:floaty 5.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.glass{position:relative;border-radius:18px;padding:10px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);box-shadow:0 18px 44px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.gcard.flip .glass{transform:rotateY(180deg);animation:none}
.gf{position:relative;border-radius:11px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.gf img{width:100%;aspect-ratio:3/4.4;object-fit:cover;display:block;pointer-events:none}
.gf.fr{position:absolute;inset:10px;transform:rotateY(180deg)}
.gcap{text-align:center;margin-top:12px}
.gcap .n{font-size:13px;letter-spacing:2px}
.gcap .r{font-size:11px;color:rgba(240,238,246,.55);margin-top:4px;letter-spacing:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
<nav><div class="navglass">
<div class="logo">玉石卡牌馆</div>
<div class="seg" id="seg"></div>
</div></nav>
<main><div class="grid" id="grid"></div></main>
<script src="data.js"></script>
<script>
var grid=document.getElementById('grid'),seg=document.getElementById('seg');
var cats=['全部','名著','漫画','游戏'],cur='全部';
seg.innerHTML=cats.map(function(c){return '<button class="'+(c===cur?'on':'')+'">'+c+'</button>';}).join('');
function render(){
  var list=CARDS.filter(function(c){return cur==='全部'||c.cat===cur;});
  grid.innerHTML=list.map(function(c,i){
    return '<div class="gcard" style="animation-delay:'+(i%8*-0.7)+'s"><div class="glass">'
    +'<div class="gf"><img loading="lazy" src="'+IMG+c.f+'.webp"></div>'
    +'<div class="gf fr"><img loading="lazy" src="'+BACK+'"></div></div>'
    +'<div class="gcap"><div class="n">'+c.name+'</div><div class="r">'+c.rank+' · '+c.theme+'</div></div></div>';
  }).join('');
}
grid.addEventListener('click',function(e){
  var g=e.target.closest('.gcard');if(g)g.classList.toggle('flip');
});
seg.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  cur=b.textContent;
  seg.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});
  render();
});
render();
</script>
</body>
</html>
